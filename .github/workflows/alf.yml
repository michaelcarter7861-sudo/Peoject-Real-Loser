name: Make Unity activation file
on: workflow_dispatch

jobs:
  alf:
    runs-on: ubuntu-latest
    steps:
      - name: Generate .alf
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" -w /out \
            unityci/editor:ubuntu-2022.3.40f1-base-3 \
            unity-editor -batchmode -nographic -createManualActivationFile -logFile - || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: unity-alf
          path: out/*.alf
          if-no-files-found: error
