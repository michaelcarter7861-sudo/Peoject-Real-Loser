name: Unity 2022.3.40f1 Android APK Build (GameCI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build-unity-apk:
    name: Validate Phase 0 Gate & Build Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 for Anti-Cheat Validation Gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Phase 0 Anti-Cheat Validation Suite v3 (All 10 Missions + Assets)
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python3 validate_levels_v3.py M01.json M02.json M03.json M04.json M05.json M06.json M07.json M08.json M09.json M10.json
          python3 validate_characters.py Assets/_Project/Art/Characters
          python3 validate_weapons.py Assets/_Project/Art/Weapons
          python3 validate_audio.py Assets/_Project/Audio
          python3 tests/verify_m10_compoundzero.py M10.json
          python3 validate_mission_objective_runtime.py
          python3 validate_consolidated_mission_mechanics.py
          python3 validate_overall_release.py
          python3 validate_android9_and_unity_compile_readiness.py

      - name: Cleanup Python cache
        run: find . -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity2022.3.40f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity2022.3.40f1-Android-

      # FIXED STEP: Sahi flag (--activate-ulf) ke sath .ulf file generate karega
      - name: Generate Personal Unity License (.ulf) Automatically
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            -v "$PWD:/license_out" \
            unityci/editor:ubuntu-2022.3.40f1-android-3 \
            /bin/bash -c '
              /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client --activate-ulf --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              ULF_PATH=$(find / -name "Unity_lic.ulf" 2>/dev/null | head -n 1)
              echo "Found ULF at: $ULF_PATH"
              cp "$ULF_PATH" /license_out/Unity_lic.ulf
            '
          echo "UNITY_LICENSE<<EOF" >> $GITHUB_ENV
          cat Unity_lic.ulf >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # BONUS: Generated .ulf file ko download karne ke liye Artifact mein daal dega
      - name: Upload Generated .ulf License (For Future Use)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Generated_Unity_License_ULF
          path: Unity_lic.ulf
          if-no-files-found: ignore

      - name: Build Unity Android ARM64 IL2CPP APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.40f1
          buildMethod: RealLoser.Editor.RealLoserProjectBuilder.BuildAndroidAPK
          buildsPath: Builds
          buildName: ProjectRealLoser_v1.0
          versioning: None

      - name: Upload ProjectRealLoser_v1.0_Unity.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectRealLoser_v1.0_Unity
          path: |
            Builds/Android/*.apk
            Builds/**/*.apk
          if-no-files-found: error
